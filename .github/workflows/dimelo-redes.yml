# Dímelo Redes: aplica la marca, comprueba, prueba la imagen con base vacía y la publica en
# ghcr.io/aridio/dimelo-redes:<etiqueta> (solo amd64, el servidor es amd64). Ver LEEME-DIMELO.md.
# Se lanza al subir una etiqueta vX.Y.Z-dwN (publica) o a mano desde la pestaña Actions (publica solo si se marca).
name: Dímelo Redes

on:
  push:
    tags:
      - 'v*-dw*'
  workflow_dispatch:
    inputs:
      etiqueta:
        description: 'Etiqueta de la imagen (p. ej. v2.25.1-dw1)'
        required: true
      publicar:
        description: 'Publicar la imagen al terminar (si no, solo construye y prueba)'
        type: boolean
        default: false

permissions:
  contents: read
  packages: write

env:
  IMAGEN: ghcr.io/aridio/dimelo-redes:${{ inputs.etiqueta || github.ref_name }}
  VERSION: ${{ inputs.etiqueta || github.ref_name }}

jobs:
  imagen:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Aplicar la marca
        run: marca/aplicar.sh

      - name: Comprobar que no queda Postiz en el código
        run: marca/comprobar.sh

      - uses: docker/setup-buildx-action@v3

      - name: Construir (amd64)
        run: |
          docker buildx build --platform linux/amd64 \
            -f Dockerfile.dev \
            --build-arg NEXT_PUBLIC_VERSION="$VERSION" \
            --label org.opencontainers.image.source=https://github.com/Aridio/dimelo-redes \
            --label org.opencontainers.image.licenses=AGPL-3.0 \
            --provenance=false --sbom=false \
            --load -t "$IMAGEN" .

      - name: Probar con base vacía
        run: |
          IMAGEN="$IMAGEN" docker compose -f marca/prueba/docker-compose.yml up -d
          listo=no
          for i in $(seq 1 60); do
            curl -sf -o /dev/null http://localhost:4007/auth/login && \
              curl -s -o /dev/null -w '%{http_code}' http://localhost:4007/api/auth/can-register | grep -q 200 && { listo=si; break; }
            sleep 10
          done
          [ "$listo" = si ] || { echo "La copia de prueba no arrancó en 10 minutos"; exit 1; }
          marca/comprobar.sh http://localhost:4007
          # Cuenta de prueba (solo existe en esta copia que se borra al terminar)
          curl -s -D cabeceras.txt -o /dev/null -H 'Content-Type: application/json' \
            -d '{"email":"prueba@dimeloweb.test","password":"Prueba-12345","company":"Prueba","provider":"LOCAL"}' \
            http://localhost:4007/api/auth/register
          AUTH="$(grep -i '^auth:' cabeceras.txt | head -1 | cut -d' ' -f2 | tr -d '\r' || true)"
          [ -n "$AUTH" ] || { echo "No se pudo crear la cuenta de prueba"; cat cabeceras.txt; exit 1; }
          echo "AUTH=$AUTH" >> "$GITHUB_ENV"
          AUTH="$AUTH" marca/comprobar.sh http://localhost:4007

      - name: Recorrido con capturas (celular, tablet, computadora; claro y oscuro)
        run: |
          mkdir -p "$RUNNER_TEMP/recorrido" && cd "$RUNNER_TEMP/recorrido"
          npm install -g pnpm@10.6.1 > /dev/null
          echo '{"name":"recorrido","private":true}' > package.json
          pnpm add playwright@1.49.1 > /dev/null
          pnpm exec playwright install --with-deps chromium > /dev/null
          cp "$GITHUB_WORKSPACE/marca/prueba/recorrido.mjs" .
          BASE=http://localhost:4007 node recorrido.mjs
        env:
          AUTH: ${{ env.AUTH }}

      - name: Guardar capturas
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: capturas-dimelo-redes
          path: ${{ runner.temp }}/recorrido/capturas/
          if-no-files-found: ignore

      - name: Registro de la prueba (si falla)
        if: failure()
        run: docker compose -f marca/prueba/docker-compose.yml logs --tail 200

      - uses: docker/login-action@v3
        if: github.event_name == 'push' || inputs.publicar
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Publicar
        if: github.event_name == 'push' || inputs.publicar
        run: docker push "$IMAGEN"
